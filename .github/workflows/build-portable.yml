name: Build portable EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "captureflow/**"
      - ".github/workflows/build-portable.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: captureflow

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: captureflow/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install locked dependencies
        run: npm ci
      - name: Check frontend
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Build portable executable
        run: npm run build:portable
      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item src-tauri/target/release/captureflow.exe release/CaptureFlow-portable.exe -Force
          Get-FileHash release/CaptureFlow-portable.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: CaptureFlow-portable
          path: captureflow/release/CaptureFlow-portable.exe
          if-no-files-found: error
